<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumo local screen sweep</title><style>body{margin:0;background:#e8ece5;color:#20261e;font:14px Arial}header{background:white;position:sticky;top:0;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}button,select{font:inherit;max-width:250px;padding:8px;border:1px solid #53614b;background:white;border-radius:6px}main{display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:16px}iframe{width:360px;height:640px;border:1px solid #7a896f;flex:none;background:white}pre{font:12px/1.5 monospace;white-space:pre-wrap;max-width:500px;overflow-wrap:anywhere}#status{font-weight:bold}button:disabled{opacity:.5}</style><header><strong>Local screen sweep</strong><select aria-label="Fixture" id="fixtures"></select><select aria-label="Viewport" id="sizes"><option value="360,640,1">360 × 640</option><option value="390,844,1">390 × 844</option><option value="412,915,1">412 × 915</option><option value="320,640,1">320 × 640</option><option value="320,640,1.5">320 × 640 · 150% text</option></select><button id="run">Run all layouts</button><button id="stop">Stop</button><span id="status">Loading fixtures</span></header><main><iframe title="Rendered Lumo screen" id="screen"></iframe><pre id="report"></pre></main><script src="/layout-sweep.js"></script></html>
