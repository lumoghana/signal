<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumo local layout audit</title><style>body{margin:0;background:#e8ece5;font:14px Arial;color:#20261e}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;position:sticky;top:0;background:#fff;z-index:2}button,select{font:inherit;padding:9px;border:1px solid #53614b;border-radius:6px;background:white}button[aria-pressed=true]{background:#b5e96a}main{padding:16px;display:flex;justify-content:center;align-items:flex-start}iframe{border:1px solid #7a896f;flex:none;background:#f8f9f4;width:360px;height:640px}small{margin-left:auto}</style><header><strong>Budget overview audit</strong><button onclick="size(360,640)" id="phone-small">360 × 640</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(412,915)">412 × 915</button><button onclick="size(320,640)">320 × 640</button><button onclick="text(1)" id="text-normal">Normal text</button><button onclick="text(1.5)" id="text-large">150% text</button><button onclick="newBudget()">New Budget</button><button onclick="fundedBudget()">First funding</button><button onclick="seedBase();f.contentWindow.L.openTab('plan')">Saved Budget</button><button onclick="seedSample()">Sample fixture</button><button onclick="sevenLines()">All 7 categories</button><button onclick="legacyItems()">Legacy items</button><button onclick="paidItems()">Partly paid</button><button onclick="pendingItem()">Pending payment</button><button onclick="layout()">Check layout</button><button onclick="seedHistory()">Budget history fixture</button><button onclick="seedHistory(4)">Four categories</button><button onclick="seedPay()">Payment fixture</button><button onclick="largeFigures()">Long name + large figures</button><button onclick="seedChat()">Conversation fixture</button><button onclick="size(390,480)">Keyboard space</button><small id="status">360 × 640 · 100% text</small></header><output id="layout-result" style="display:block;white-space:pre-wrap;padding:8px;background:white"></output><main><iframe id="audit-phone" title="Lumo phone layout" src="/?ambassador=1"></iframe></main><script>let w=360,h=640,t=1;const f=document.getElementById('audit-phone');function update(){f.style.width=w+'px';f.style.height=h+'px';try{f.contentDocument.documentElement.style.fontSize=(16*t)+'px'}catch{}document.getElementById('status').textContent=w+' × '+h+' · '+Math.round(t*100)+'% text';}function size(width,height){w=width;h=height;update()}function text(scale){t=scale;update()}f.addEventListener('load',update);function seedSample(){const L=f.contentWindow.L;L.explore();}function largeFigures(){const L=f.contentWindow.L;L.explore();L.state.profile.displayName='NanaAkuaAdomMensahBoateng';L.state.balance=987654.32;L.state.goals[0].allocated=123456.78;L.save();L.go('home');}function seedChat(){const L=f.contentWindow.L;L.openBankingChat();for(const q of ['What did I spend today?','Can I spend GH₵80?','Pay Akua GH₵25 from Food','How long will my money last?']){const answer=L.chatAnswer(q);(L.state.chats||=[]).push({q,...answer});}L.save();L.render();}function seedBase(){const L=f.contentWindow.L;L.explore();L.ensureAccounts();const date=n=>new Date(Date.now()+n*86400000).toISOString().slice(0,10);Object.assign(L.state,{balance:500,txs:[],chats:[],paymentDraft:null,planSaved:true,planDraft:null,budgetCycleDraft:null,firstBudgetPayoff:null,essentials:[{id:'food',name:'Food',amount:250,paid:0,externalPaid:0,coverageVersion:1,date:''},{id:'transport',name:'Transport',amount:100,paid:0,externalPaid:0,coverageVersion:1,date:''}],goals:[{id:'laptop',name:'Laptop',allocated:100,target:3000,boxVersion:2}],planHorizon:{mode:'date',date:date(6)},allowance:{amount:600,date:date(7),source:'Family'},budgetHistoryDraft:null,budgetGuideSession:null,pauseRecoveryFunding:null,budgetPurposeRules:[],budgetIncomeReview:null});L.save();return L;}
function seedOutlook(){const L=seedBase();L.state.balance=490;L.save();L.openTab('home');L.render();}
function seedHistory(count=2){const L=seedBase(),DAY=86400000,today=Date.parse(new Date().toISOString().slice(0,10)+'T00:00:00Z'),monday=today-((new Date(today).getUTCDay()+6)%7)*DAY;L.state.accounts.createdAt=new Date(Date.now()-60*DAY).toISOString();L.state.essentials=[];L.state.planSaved=false;L.state.balance=1000;L.state.txs=[];for(let week=1;week<=4;week++)for(const [name,amount]of [['Food',180],['Transport',60],['Data',30],['Study',40]].slice(0,count)){L.state.txs.push({id:'h'+week+name,type:'out',status:'success',name:name+' at campus',category:name,amount,fee:0,method:'Campus Pay',date:new Date(monday-week*7*DAY+12*3600000).toISOString()});}L.save();L.openTab('plan');L.render();}
function seedPay(){const L=seedBase();L.openTab('home');L.pickMerchant('AK01');}
function newBudget(){const L=seedBase();Object.assign(L.state,{essentials:[],planSaved:false,planDraft:null,budgetGuideSession:null,planHorizon:{mode:'unspecified',date:''}});L.save();L.openTab('plan');L.render();return L;}function fundedBudget(){const L=newBudget();L.state.txs=[{id:'qa-credit',type:'in',status:'success',amount:500,fee:0,name:'Sample allowance',date:new Date().toISOString()}];L.state.budgetPrompt={txId:'qa-credit',done:false,hasBudget:false};L.save();L.go('budgetAfterFunding');}function sevenLines(){const L=seedBase(),cats=L.budgetCategories.list;L.state.essentials=cats.map((c,i)=>({id:'seven-'+c.id,name:c.name,budgetCategory:c.id,amount:[200,100,50,75,150,80,25][i],paid:0,externalPaid:0,coverageVersion:1,date:''}));L.state.balance=1200;L.save();L.openTab('plan');L.render();}
function legacyItems(){const L=seedBase();L.state.essentials=[['Lunch',100],['Groceries',150],['Trotro',80],['Printing',40],['Rent',500],['WiFi',90],['Toiletries',60],['Birthday gift',50],['Mystery cost',20]].map(([name,amount],i)=>({id:'legacy-'+i,name,amount,paid:0,externalPaid:0,coverageVersion:1,date:''}));L.state.balance=1500;L.save();L.openTab('plan');L.render();}
function paidItems(){const L=seedBase();L.state.txs=[{id:'paid-food',type:'out',status:'success',amount:80,fee:0,essentialId:'food',name:'Food purchase',category:'Food',date:new Date().toISOString()}];L.state.balance=420;L.reconcileEssentialCoverage();L.save();L.openTab('plan');L.render();}
function pendingItem(){const L=seedBase();L.state.txs=[{id:'pending-food',type:'out',status:'pending',amount:80,fee:0,essentialId:'food',name:'Food purchase',category:'Food',date:new Date().toISOString()}];L.save();L.openTab('plan');L.render();}
function layout(){const d=f.contentDocument,v=d.getElementById('view'),els=[...d.querySelectorAll('button,input,select')].filter(x=>x.getClientRects().length),report=els.filter(x=>/L.budgetOverview|L.budgetGuide|Save budget|Save my budget/.test(x.getAttribute('onclick')||x.textContent)).map(x=>({label:x.getAttribute('aria-label')||x.textContent.trim(),top:Math.round(x.getBoundingClientRect().top),bottom:Math.round(x.getBoundingClientRect().bottom)}));document.getElementById('layout-result').textContent=JSON.stringify({viewport:[w,h],text:t,route:f.contentWindow.L.route,horizontal:d.documentElement.scrollWidth>w,viewScroll:[v.clientHeight,v.scrollHeight],actions:report},null,2);}
</script></html>
