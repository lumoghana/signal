<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumo local layout audit</title><style>body{margin:0;background:#e8ece5;font:14px Arial;color:#20261e}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;position:sticky;top:0;background:#fff;z-index:2}button,select{font:inherit;padding:9px;border:1px solid #53614b;border-radius:6px;background:white}button[aria-pressed=true]{background:#b5e96a}main{padding:16px;display:flex;justify-content:center;align-items:flex-start}iframe{border:1px solid #7a896f;flex:none;background:#f8f9f4;width:360px;height:640px}small{margin-left:auto}</style><header><strong>Local layout audit</strong><button onclick="size(360,640)" id="phone-small">360 × 640</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(412,915)">412 × 915</button><button onclick="size(320,640)">320 × 640</button><button onclick="text(1)" id="text-normal">Normal text</button><button onclick="text(1.5)" id="text-large">150% text</button><small id="status">360 × 640 · 100% text</small></header><main><iframe id="audit-phone" title="Lumo phone layout" src="/?ambassador=1"></iframe></main><script>let w=360,h=640,t=1;const f=document.getElementById('audit-phone');function update(){f.style.width=w+'px';f.style.height=h+'px';try{f.contentDocument.documentElement.style.fontSize=(16*t)+'px'}catch{}document.getElementById('status').textContent=w+' × '+h+' · '+Math.round(t*100)+'% text';}function size(width,height){w=width;h=height;update()}function text(scale){t=scale;update()}f.addEventListener('load',update);</script></html>
