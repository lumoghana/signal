<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumo local layout audit</title><style>body{margin:0;background:#e8ece5;font:14px Arial;color:#20261e}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;position:sticky;top:0;background:#fff;z-index:2}button,select{font:inherit;padding:9px;border:1px solid #53614b;border-radius:6px;background:white}button[aria-pressed=true]{background:#b5e96a}main{padding:16px;display:flex;justify-content:center;align-items:flex-start}iframe{border:1px solid #7a896f;flex:none;background:#f8f9f4;width:360px;height:640px}small{margin-left:auto}</style><header><strong>Guided Budget audit</strong><button onclick="size(360,640)" id="phone-small">360 × 640</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(412,915)">412 × 915</button><button onclick="size(320,640)">320 × 640</button><button onclick="text(1)" id="text-normal">Normal text</button><button onclick="text(1.5)" id="text-large">150% text</button><button onclick="newBudget()">New Budget</button><button onclick="fundedBudget()">First funding</button><button onclick="seedBase();f.contentWindow.L.openTab('plan')">Saved Budget</button><button onclick="seedSample()">Sample fixture</button><button onclick="seedOutlook()">Daily guide fixture</button><button onclick="seedHistory()">Budget history fixture</button><button onclick="seedHistory(4)">Four categories</button><button onclick="seedPay()">Payment fixture</button><button onclick="largeFigures()">Long name + large figures</button><button onclick="seedChat()">Conversation fixture</button><button onclick="size(390,480)">Keyboard space</button><small id="status">360 × 640 · 100% text</small></header><main><iframe id="audit-phone" title="Lumo phone layout" src="/?ambassador=1"></iframe></main><script>let w=360,h=640,t=1;const f=document.getElementById('audit-phone');function update(){f.style.width=w+'px';f.style.height=h+'px';try{f.contentDocument.documentElement.style.fontSize=(16*t)+'px'}catch{}document.getElementById('status').textContent=w+' × '+h+' · '+Math.round(t*100)+'% text';}function size(width,height){w=width;h=height;update()}function text(scale){t=scale;update()}f.addEventListener('load',update);function seedSample(){const L=f.contentWindow.L;L.explore();}function largeFigures(){const L=f.contentWindow.L;L.explore();L.state.profile.displayName='NanaAkuaAdomMensahBoateng';L.state.balance=987654.32;L.state.goals[0].allocated=123456.78;L.save();L.go('home');}function seedChat(){const L=f.contentWindow.L;L.openBankingChat();for(const q of ['What did I spend today?','Can I spend GH₵80?','Pay Akua GH₵25 from Food','How long will my money last?']){const answer=L.chatAnswer(q);(L.state.chats||=[]).push({q,...answer});}L.save();L.render();}function seedBase(){const L=f.contentWindow.L;L.explore();L.ensureAccounts();const date=n=>new Date(Date.now()+n*86400000).toISOString().slice(0,10);Object.assign(L.state,{balance:500,txs:[],chats:[],paymentDraft:null,planSaved:true,planDraft:null,budgetCycleDraft:null,firstBudgetPayoff:null,essentials:[{id:'food',name:'Food',amount:250,paid:0,externalPaid:0,coverageVersion:1,date:''},{id:'transport',name:'Transport',amount:100,paid:0,externalPaid:0,coverageVersion:1,date:''}],goals:[{id:'laptop',name:'Laptop',allocated:100,target:3000,boxVersion:2}],planHorizon:{mode:'date',date:date(6)},allowance:{amount:600,date:date(7),source:'Family'},budgetHistoryDraft:null,pauseRecoveryFunding:null});L.save();return L;}
function seedOutlook(){const L=seedBase();L.state.balance=490;L.save();L.openTab('home');L.render();}
function seedHistory(count=2){const L=seedBase(),DAY=86400000,today=Date.parse(new Date().toISOString().slice(0,10)+'T00:00:00Z'),monday=today-((new Date(today).getUTCDay()+6)%7)*DAY;L.state.accounts.createdAt=new Date(Date.now()-60*DAY).toISOString();L.state.essentials=[];L.state.planSaved=false;L.state.balance=1000;L.state.txs=[];for(let week=1;week<=4;week++)for(const [name,amount]of [['Food',180],['Transport',60],['Data',30],['Study',40]].slice(0,count)){L.state.txs.push({id:'h'+week+name,type:'out',status:'success',name:name+' at campus',category:name,amount,fee:0,method:'Campus Pay',date:new Date(monday-week*7*DAY+12*3600000).toISOString()});}L.save();L.openTab('plan');L.render();}
function seedPay(){const L=seedBase();L.openTab('home');L.pickMerchant('AK01');}
function newBudget(){const L=seedBase();Object.assign(L.state,{essentials:[],planSaved:false,planDraft:null,budgetGuideSession:null,planHorizon:{mode:'unspecified',date:''}});L.save();L.openTab('plan');L.render();return L;}function fundedBudget(){const L=newBudget();L.state.txs=[{id:'qa-credit',type:'in',status:'success',amount:500,fee:0,name:'Sample allowance',date:new Date().toISOString()}];L.state.budgetPrompt={txId:'qa-credit',done:false,hasBudget:false};L.save();L.go('budgetAfterFunding');}</script></html>
